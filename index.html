<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>blendf</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      color: #eee;
      font-family: sans-serif;
    }

    .top {
      max-width: 640px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #999;
      margin: 0 0 40px;
      font-size: 15px;
    }

    .demo-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .demo-link {
      display: block;
      padding: 20px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      text-decoration: none;
      color: #eee;
      transition: border-color 0.2s, background 0.2s;
    }

    .demo-link:hover {
      border-color: #ff8844;
      background: #221a14;
    }

    .demo-link .demo-title {
      display: block;
      font-size: 17px;
      font-weight: bold;
      color: #ff8844;
      margin-bottom: 4px;
    }

    .demo-link .demo-desc {
      display: block;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="top">
    <h1>blendf</h1>
    <p class="subtitle">2D implicit field blending visualizations</p>

    <div class="demo-list">
      <a class="demo-link" href="step-by-step.html">
        <span class="demo-title">Step by Step Visualization</span>
        <span class="demo-desc">Gaussian / Log-Sum-Exp field blending, contour search, and surface exploration.</span>
      </a>
    </div>
  </div>
</body>
</html>
